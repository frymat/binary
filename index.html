<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情報I 二進数ワークショップ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e6c93; /* 元のGoogleサイトと同じ綺麗な青色 */
            font-family: 'Comic Sans MS', 'Meiryo', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff9900; /* 元のサイトと同じオレンジ色 */
            font-size: 4rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: pop 0.5s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @media only screen and (max-width: 480px) {
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Congratulations！</h1>
    </div>
</body>
</html>
